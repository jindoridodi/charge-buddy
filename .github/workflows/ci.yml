name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused tests
        run: npm run test:unit
      - name: Price-report database permissions
        if: runner.os == 'Linux'
        run: npm run test:reports:db
      - name: Production build
        run: npm run build
      - name: HTTP smoke tests
        run: npm test
